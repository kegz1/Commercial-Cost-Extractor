# Secret Kitchens creator pages — Netlify config
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Functions read creators/<slug>/data/creator.json at runtime.
  included_files = ["creators/*/data/creator.json"]

# Pretty URL for the API. Functions also declare `config.path`, this keeps
# `/api/*` working under `netlify dev` and for any future functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Later: creators.secret-kitchens.com/<handle> -> /creators/<handle>/
# [[redirects]]
#   from = "https://creators.secret-kitchens.com/*"
#   to = "/creators/:splat"
#   status = 200

[[headers]]
  for = "/creators/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
